syntax = "proto3";

package NPerforator.NBinaryProcessing.NLua;

option go_package = "github.com/yandex/perforator/perforator/agent/preprocessing/proto/lua";

message LuaVersion {
  uint32 Major = 1;
  uint32 Minor = 2;
}

// See documentation in perforator/agent/collector/progs/unwinder/lua/types.h
message LuaConfig {
  LuaVersion Version = 1;
  uint64 OffsetGtoL = 2;
  uint64 OffsetGtoDispatch = 3;
  uint64 BinarySize = 4;
  uint64 VmStartPc = 5;
  uint64 VmEndPc = 6;
}
