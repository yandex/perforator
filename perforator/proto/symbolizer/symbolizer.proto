syntax="proto3";

package NPerforator.NProto.NSymbolizer;

option go_package = "github.com/yandex/perforator/perforator/proto/symbolizer";

service Symbolizer {
    // One RPC per binary; failures come back as gRPC status codes.
    rpc Symbolize(SymbolizeRequest) returns (SymbolizeResponse) {}
};

message SymbolizeRequest {
    reserved 1;

    string BuildID = 2;
    repeated uint64 Addresses = 3;

    // Addresses are ELF file offsets (Address + Mapping.Offset - Mapping.Start) that
    // still need the first PT_LOAD p_vaddr added before symbolization; a later
    // migration to true virtual addresses drops this flag.
    bool HasSkewedAddresses = 4;
}

message Frame {
    string FunctionName = 1; // mangled
    string DemangledFunctionName = 2;
    string FileName = 3;
    uint32 StartLine = 4;
    uint32 Line = 5;
    uint32 Column = 6;
    uint32 Discriminator = 7;
}

// Inline chain for one address, innermost (leaf) first; empty = not symbolized.
message AddressResult {
    repeated Frame Frames = 1;
}

message SymbolizeResponse {
    reserved 1;

    // One entry per requested address, positionally 1:1 with the request.
    repeated AddressResult Addresses = 2;
}
