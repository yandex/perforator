syntax = "proto3";

package NPerforator.NProto.NProfile;

import "perforator/proto/lib/compression/compression.proto";

option go_package = "github.com/yandex/perforator/perforator/proto/profile";

message ProfileContainer {
    message Payload {
        NPerforator.NProto.NLib.CompressionMethod compression_method = 1;
        bytes data = 2;
    }

    Payload pprof = 1;
    Payload yaprof = 2;
}
